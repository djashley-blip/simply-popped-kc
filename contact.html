<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Contact Simply Popped KC for balloon décor quotes">
    <meta name="keywords" content="contact form, balloon décor quote">
    <meta name="author" content="Simply Popped KC">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simply Popped KC | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="packages.html">Packages</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="intro">
            <h2>Request a Quote</h2>
            <p>Fill out the form below to request balloon décor information for your event.</p>
        </section>

        <section class="form-section">
            <form action="#" method="post">
                <label>Name:</label>
                <input type="text" name="name" required>

                <label>Email:</label>
                <input type="email" name="email" required>

                <label>Event Type:</label>
                <select name="event-type">
                    <option>Birthday</option>
                    <option>Graduation</option>
                    <option>Wedding</option>
                    <option>Baby Shower</option>
                    <option>School Event</option>
                    <option>Business Event</option>
                </select>

                <label>Event Date:</label>
                <input type="date" name="event-date">

                <label>Event Location:</label>
                <input type="text" name="location">

                <label>Estimated Budget:</label>
                <input type="number" name="budget">

                <label>Event Details / Comments:</label>
                <textarea name="details"></textarea>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Simply Popped KC</p>
    </footer>
</body>
</html>
